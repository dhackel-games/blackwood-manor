<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#241748"/>
      <stop offset="45%" stop-color="#150d2e"/>
      <stop offset="100%" stop-color="#070512"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fbf6d6" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#e9e2b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e9e2b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="doorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb04d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb04d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDev="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="180" ry="180"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- sky -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fdfbe6">
      <circle cx="120" cy="150" r="3" opacity="0.8"/>
      <circle cx="230" cy="95"  r="2" opacity="0.6"/>
      <circle cx="330" cy="200" r="2.5" opacity="0.7"/>
      <circle cx="170" cy="300" r="2" opacity="0.5"/>
      <circle cx="900" cy="150" r="2.5" opacity="0.7"/>
      <circle cx="960" cy="330" r="2" opacity="0.5"/>
      <circle cx="480" cy="110" r="2" opacity="0.6"/>
      <circle cx="620" cy="90"  r="3" opacity="0.75"/>
    </g>

    <!-- moon -->
    <circle cx="720" cy="285" r="230" fill="url(#moonGlow)"/>
    <circle cx="720" cy="285" r="140" fill="#f6f2d0"/>
    <g fill="#e4dfb8" opacity="0.6">
      <circle cx="688" cy="255" r="20"/>
      <circle cx="748" cy="300" r="28"/>
      <circle cx="705" cy="330" r="14"/>
    </g>

    <!-- bats -->
    <g fill="#0a0714">
      <path d="M400 210 q18 -22 36 0 q18 -22 36 0 q-18 8 -36 2 q-18 6 -36 -2 Z"/>
      <path d="M300 275 q14 -18 28 0 q14 -18 28 0 q-14 6 -28 2 q-14 4 -28 -2 Z"/>
      <path d="M540 165 q11 -14 22 0 q11 -14 22 0 q-11 5 -22 1 q-11 4 -22 -1 Z"/>
    </g>

    <!-- distant hill -->
    <path d="M0 880 C 200 840 380 900 520 878 C 700 852 860 905 1024 872 L1024 1024 L0 1024 Z" fill="#0d0a20"/>

    <!-- MANSION -->
    <g fill="#08060f">
      <!-- left wing -->
      <rect x="300" y="612" width="150" height="262"/>
      <polygon points="286,614 375,512 460,614"/>
      <!-- center block -->
      <rect x="430" y="524" width="182" height="350"/>
      <polygon points="416,526 521,400 626,526"/>
      <!-- tower -->
      <rect x="600" y="470" width="98" height="404"/>
      <polygon points="590,472 649,320 708,472"/>
      <!-- finial -->
      <rect x="645" y="292" width="8" height="34"/>
      <circle cx="649" cy="292" r="9"/>
      <!-- chimneys -->
      <rect x="470" y="410" width="24" height="70"/>
      <rect x="556" y="430" width="22" height="62"/>
    </g>

    <!-- warm door glow -->
    <ellipse cx="521" cy="840" rx="120" ry="90" fill="url(#doorGlow)"/>

    <!-- lit windows -->
    <g filter="url(#glow)">
      <g fill="#ffce7a">
        <!-- center upper -->
        <rect x="470" y="470" width="30" height="42" rx="4"/>
        <rect x="542" y="470" width="30" height="42" rx="4"/>
        <!-- center lower -->
        <rect x="452" y="588" width="30" height="44" rx="4"/>
        <rect x="560" y="588" width="30" height="44" rx="4"/>
        <!-- left wing -->
        <rect x="322" y="668" width="30" height="42" rx="4"/>
        <!-- tower windows (arched, narrow) -->
        <rect x="633" y="540" width="24" height="40" rx="12"/>
        <rect x="633" y="618" width="24" height="40" rx="12"/>
        <rect x="633" y="696" width="24" height="40" rx="12"/>
      </g>
      <!-- one green window (a nod to the terminal) -->
      <rect x="392" y="668" width="30" height="42" rx="4" fill="#79ffb0"/>
      <!-- glowing door -->
      <path d="M498 874 v-52 a23 23 0 0 1 46 0 v52 Z" fill="#ffb04d"/>
    </g>

    <!-- foreground hill -->
    <path d="M0 946 C 250 916 410 962 560 940 C 770 912 900 966 1024 946 L1024 1024 L0 1024 Z" fill="#05040c"/>

    <!-- gate posts -->
    <g fill="#0a0816">
      <rect x="150" y="900" width="20" height="90"/>
      <rect x="854" y="900" width="20" height="90"/>
    </g>
  </g>
</svg>
</body>
</html>
